appId: com.larajulious.chitsapp
---
- assertVisible: "Toggle style QA"
- takeScreenshot: clipping-before
- tapOn: "Toggle style QA"
- takeScreenshot: clipping-after-1
- tapOn: "Toggle style QA"
- takeScreenshot: clipping-after-2
- tapOn: "Toggle style QA"
- takeScreenshot: clipping-after-3
- tapOn: "Toggle style QA"
- takeScreenshot: clipping-after-4
- tapOn: "Toggle style QA"
- takeScreenshot: clipping-after-5
- tapOn: "Toggle dark QA"
- takeScreenshot: clipping-dark
- scroll
- tapOn: "Toggle style QA"
- takeScreenshot: clipping-scrolled
- tapOn: "Open settings QA"
- tapOn: "Sticky style"
- runFlow:
    when:
      platform: Android
    commands:
      - back
- runFlow:
    when:
      platform: iOS
    commands:
      - swipe:
          start: "1%,50%"
          end: "90%,50%"
          duration: 1000
- takeScreenshot: settings-return
- tapOn: "QA input"
- inputText: "Keyboard QA"
- tapOn: "Toggle style QA"
- takeScreenshot: keyboard-style
- tapOn: "Toggle dark QA"
- takeScreenshot: keyboard-dark
- hideKeyboard
- tapOn: "Toggle style QA"
- takeScreenshot: keyboard-closed
