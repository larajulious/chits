<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1250 1250" width="512" height="512" role="img" aria-label="Chits mascot waving" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    /* Whole character: gentle hop */
    #character { animation: hop 2.4s ease-in-out infinite; transform-box: view-box; transform-origin: 650px 1120px; }
    @keyframes hop {
      0%, 100% { transform: translateY(0) scale(1, 1); }
      45%      { transform: translateY(-28px) scale(0.99, 1.01); }
      90%      { transform: translateY(0) scale(1.02, 0.98); }
    }

    /* Ground shadow shrinks while airborne */
    #shadow { animation: shadow 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes shadow {
      0%, 100% { transform: scale(1); opacity: 0.18; }
      45%      { transform: scale(0.82); opacity: 0.1; }
    }

    /* Body leans side to side */
    #body-sway { animation: sway 4.8s ease-in-out infinite; transform-box: view-box; transform-origin: 650px 1000px; }
    @keyframes sway {
      0%, 100% { transform: rotate(-2deg); }
      50%      { transform: rotate(2deg); }
    }

    /* Right arm waves from the shoulder */
    #arm-right { animation: wave 1.2s ease-in-out infinite; transform-box: view-box; transform-origin: 1050px 690px; }
    @keyframes wave {
      0%, 100% { transform: rotate(-12deg); }
      50%      { transform: rotate(18deg); }
    }

    /* Left arm swings gently */
    #arm-left { animation: swing 2.4s ease-in-out infinite; transform-box: view-box; transform-origin: 240px 745px; }
    @keyframes swing {
      0%, 100% { transform: rotate(0deg); }
      50%      { transform: rotate(10deg); }
    }

    /* Blink every 4s */
    .eye { animation: blink 4s infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes blink {
      0%, 90%, 100% { transform: scaleY(1); }
      93%           { transform: scaleY(0.08); }
      96%           { transform: scaleY(1); }
    }

    /* Tape flutters slightly */
    #tape { animation: flutter 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 100%; }
    @keyframes flutter {
      0%, 100% { transform: rotate(0deg); }
      50%      { transform: rotate(-3deg); }
    }

    /* Accessibility: stop motion if the user prefers */
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
    }
  </style>

  <!-- Ground shadow -->
  <ellipse id="shadow" cx="650" cy="1150" rx="260" ry="28" fill="#000" opacity="0.18"/>

  <g id="character">
    <!-- Legs (behind body) -->
    <g id="legs" fill="#1C1B1F" stroke="#1C1B1F" stroke-linecap="round">
      <!-- Warm edges keep the dark limbs visible on dark surfaces. -->
      <line x1="530" y1="960" x2="495" y2="1080" stroke="#E9D7A5" stroke-width="92"/>
      <line x1="530" y1="960" x2="495" y2="1080" stroke-width="44"/>
      <ellipse cx="490" cy="1095" rx="90" ry="64" fill="#E9D7A5" stroke="none"/>
      <ellipse cx="490" cy="1095" rx="66" ry="40"/>
      <line x1="745" y1="950" x2="785" y2="1060" stroke="#E9D7A5" stroke-width="92"/>
      <line x1="745" y1="950" x2="785" y2="1060" stroke-width="44"/>
      <ellipse cx="822" cy="1074" rx="96" ry="64" transform="rotate(-8 822 1074)" fill="#E9D7A5" stroke="none"/>
      <ellipse cx="822" cy="1074" rx="72" ry="40" transform="rotate(-8 822 1074)"/>
    </g>

    <g id="body-sway">
      <!-- Arms (behind body) -->
      <g id="arm-left" fill="none" stroke="#1C1B1F" stroke-linecap="round" stroke-width="46">
        <path d="M250 740 Q175 780 160 860" stroke="#E9D7A5" stroke-width="94"/>
        <path d="M250 740 Q175 780 160 860"/>
        <circle cx="166" cy="875" r="64" fill="#E9D7A5" stroke="none"/>
        <circle cx="166" cy="875" r="40" fill="#1C1B1F" stroke="none"/>
      </g>
      <g id="arm-right" fill="none" stroke="#1C1B1F" stroke-linecap="round" stroke-width="46">
        <path d="M1040 690 Q1105 660 1128 585" stroke="#E9D7A5" stroke-width="94"/>
        <path d="M1040 690 Q1105 660 1128 585"/>
        <circle cx="1140" cy="560" r="66" fill="#E9D7A5" stroke="none"/>
        <circle cx="1140" cy="560" r="42" fill="#1C1B1F" stroke="none"/>
      </g>

      <!-- Sticky note body, drawn upright then tilted -->
      <g transform="translate(640 610) rotate(-7)">
        <!-- Thickness / side edge -->
        <path d="M-410 -280 Q-410 -345 -345 -345 L320 -345 Q380 -345 380 -285 L380 190 Q330 350 160 390 L-345 390 Q-405 390 -405 330 Z" fill="#F5C048"/>
        <!-- Front face with peeled corner cut -->
        <path d="M-380 -305 Q-380 -365 -320 -365 L320 -365 Q380 -365 380 -305 L380 165 Q330 330 170 365 L-320 365 Q-380 365 -380 305 Z" fill="#FBE482"/>
        <!-- Peeled corner flap -->
        <path d="M380 165 Q300 185 270 230 Q255 310 170 365 Q340 345 380 165 Z" fill="#F9C94C"/>

        <!-- Tape -->
        <g id="tape">
          <rect x="-120" y="-395" width="270" height="105" rx="10" fill="#FCD96A" opacity="0.8"/>
          <rect x="-112" y="-440" width="270" height="130" rx="14" fill="#EDB23A"/>
          <rect x="-105" y="-448" width="262" height="124" rx="14" fill="#FBC94E"/>
        </g>

        <!-- Face -->
        <g id="face">
          <circle cx="-250" cy="55" r="48" fill="#F9AC85"/>
          <circle cx="268" cy="38" r="48" fill="#F9AC85"/>
          <ellipse class="eye" cx="-170" cy="-45" rx="38" ry="55" fill="#1C1B1F"/>
          <ellipse class="eye" cx="185" cy="-48" rx="38" ry="55" fill="#1C1B1F"/>
          <path d="M-65 -8 C-55 55 65 55 75 -14" fill="none" stroke="#1C1B1F" stroke-width="36" stroke-linecap="round"/>
        </g>
      </g>
    </g>
  </g>
</svg>
